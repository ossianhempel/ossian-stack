  /* ---- tokens: one deliberate light theme, painted explicitly ---- */
  :root {
    --bg: #faf9f6;

    --ink: #1c1c21;
    --ink-2: #5b5f6a;
    --ink-3: #8a8f98;
    --line: #dcdad3;
    --line-2: #ebe9e3;
    --accent: #2f6fed;        /* brand: "you run it" */
    --accent-soft: #e6eefc;
    --auto: #0e8a7a;          /* semantic: "runs for you" */
    --auto-soft: #e0f3f0;
    --agent: #8957e5;         /* semantic: subagent */
    --agent-soft: #efe8fb;
    --ref: #8a8f98;           /* semantic: reference */
    --track: #c9c5bb;
    --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); color-scheme: light; }
  body { padding: 24px; }
  body.shot { padding: 0; width: 2000px; }
  .bar { display: flex; align-items: center; gap: 12px; max-width: 2000px; margin: 0 auto 14px; }
  .bar h1 { font-size: 16px; font-weight: 600; margin: 0; }
  .bar .sp { flex: 1; }
  .bar button, .bar a { font: inherit; font-size: 13px; color: var(--ink); background: var(--board); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; text-decoration: none; }
  .bar button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  body.shot .bar { display: none; }
  #wrap { max-width: 2000px; margin: 0 auto; overflow-x: auto; }
  svg { display: block; width: 100%; height: auto; background: var(--board); border: 1px solid var(--line); border-radius: 16px; }
  body.shot svg { border: 0; border-radius: 0; }

  /* ---- svg text + shapes ---- */
  svg text { font-family: var(--font); fill: var(--ink); }
  .t-title { font-size: 26px; font-weight: 700; }
  .t-sub { font-size: 14px; fill: var(--ink-2); }
  .t-h { font-size: 15px; font-weight: 600; }
  .t-cap { font-size: 11px; fill: var(--ink-2); }
  .t-tiny { font-size: 10.5px; fill: var(--ink-3); letter-spacing: .02em; text-transform: uppercase; }
  .t-mono { font-family: var(--mono); font-size: 11px; fill: var(--ink-3); }
  .region { fill: var(--bg); stroke: var(--line); rx: 14; }
  .tile { fill: var(--board); stroke: var(--line); rx: 10; }
  .chip { fill: var(--board); stroke: var(--line); rx: 6; }
  .chipg text { font-size: 11.5px; fill: var(--ink-2); }
  .track { fill: none; stroke: var(--track); stroke-width: 2.5; }
  .arrow { stroke: var(--ink-3); stroke-width: 1.5; fill: none; }
  .link { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 4 4; pointer-events: none; }

  /* ---- node pills: role is in the shape, not in words ---- */
  .node { cursor: pointer; outline: none; }
  .node text.lbl { font-size: 13px; font-weight: 500; }
  .node .pill { stroke-width: 1.5; }
  .node.r-human .pill { fill: var(--accent); stroke: var(--accent); }
  .node.r-human text.lbl { fill: #fff; }
  .node.r-both .pill { fill: var(--board); stroke: var(--accent); }
  .node.r-both text.lbl { fill: var(--accent); }
  .node.r-auto .pill { fill: var(--auto); stroke: var(--auto); }
  .node.r-auto text.lbl { fill: #fff; }
  .node.r-knowledge .pill { fill: var(--board); stroke: var(--ref); stroke-dasharray: 5 3; }
  .node.r-knowledge text.lbl { fill: var(--ink-2); }
  .node.agent .pill { fill: var(--agent); stroke: var(--agent); }
  .node.agent text.lbl { fill: #fff; }
  .node.optional { opacity: .78; }
  .node .badge { fill: var(--agent-soft); stroke: var(--agent); stroke-width: 1; }
  .node .badge-t { font-size: 10px; font-weight: 600; fill: var(--agent); }
  .node .badge.k { fill: #f1f1ee; stroke: var(--ref); }
  .node .badge-t.k { fill: var(--ink-2); }
  .node:focus-visible .pill { stroke: var(--ink); stroke-width: 2.5; }
  svg.lit .node { opacity: .25; }
  svg.lit .node.on { opacity: 1; }
  svg.lit .node.on .pill { filter: drop-shadow(0 2px 6px rgba(47,111,237,.35)); }
  .entry .pill { fill: var(--ink); stroke: var(--ink); }
  .entry text { fill: #fff; }
  .entry .pill { rx: 18; }

  /* ---- drawer ---- */
  #drawer { position: fixed; top: 0; right: 0; height: 100vh; width: min(420px, 100vw); background: var(--board); border-left: 1px solid var(--line); box-shadow: -12px 0 32px rgba(0,0,0,.08); transform: translateX(105%); transition: transform .18s ease; overflow-y: auto; padding: 22px 24px 40px; box-sizing: border-box; z-index: 10; }
  #drawer.open { transform: none; }
  #drawer h2 { margin: 0 0 4px; font-size: 20px; }
  #drawer .id { font-family: var(--mono); font-size: 12px; color: var(--ink-3); }
  #drawer .meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0; }
  #drawer .meta span { font-size: 12px; border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; color: var(--ink-2); }
  #drawer .meta span.role { border-color: var(--accent); color: var(--accent); }
  #drawer p { font-size: 14px; line-height: 1.5; color: var(--ink); }
  #drawer h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); margin: 22px 0 8px; }
  #drawer .hint { font-family: var(--mono); font-size: 12px; background: var(--bg); border: 1px solid var(--line); padding: 8px 10px; border-radius: 8px; }
  #drawer ul { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 6px; }
  #drawer li button { font: inherit; font-size: 12.5px; font-family: var(--mono); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; cursor: pointer; color: var(--ink); }
  #drawer li button:hover { border-color: var(--accent); color: var(--accent); }
  #drawer .none { color: var(--ink-3); font-size: 13px; }
  #drawer .close { position: absolute; top: 14px; right: 14px; font: inherit; background: none; border: 1px solid var(--line); border-radius: 8px; width: 32px; height: 32px; cursor: pointer; color: var(--ink-2); }
  #drawer a { color: var(--accent); }
</style>

<script>
(() => {
  const DATA = JSON.parse(document.getElementById("plugin-map-data").textContent);
  const q = new URLSearchParams(location.search);
  const SHOT = q.get("shot") === "1";
  let expanded = q.get("expanded") === "1";
  if (SHOT) document.body.classList.add("shot");

  // ======================================================= geometry block
  // Every absolute coordinate lives here; the rest is relative.
  const G = {
    W: 2000, PAD: 40,
    headerH: 118,
    entryX: 40, entryW: 200, entryH: 92,
    laneX: 300, laneW: 1180, laneGap: 22, lanePad: 16,
    titleH: 38, pillH: 34, pillPadX: 14, arrowW: 30, capH: 16, optH: 14,
    extraH: 28, extraGap: 12,
    platX: 1520, platW: 440, platCols: 2, platGap: 12,
    sideGap: 30, legendH: 58, footerH: 36,
    font: "500 13px Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif",
    smallFont: "500 12px Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif",
  };

  // ======================================================= clusters
  const SEC = DATA.sections;
  const NODES = DATA.nodes;
  const roleOf = (id) => NODES[id]?.type === "agent" ? "agent" : NODES[id]?.role;
  const collapsedTargets = (id) => (NODES[id]?.calls ?? []).filter((t) => roleOf(t) === "knowledge" || roleOf(t) === "agent");

  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("board");
  const el = (tag, attrs = {}, parent) => {
    const n = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) if (v !== null && v !== undefined) n.setAttribute(k, v);
    if (parent) parent.appendChild(n);
    return n;
  };
  const text = (parent, x, y, s, cls, attrs = {}) => { const t = el("text", { x, y, class: cls, ...attrs }, parent); t.textContent = s; return t; };
  const ctx = document.createElement("canvas").getContext("2d");
  const measure = (s, font = G.font) => { ctx.font = font; return ctx.measureText(s).width; };
  const pillW = (id) => Math.ceil(measure(id)) + G.pillPadX * 2;
  const badgeInfo = (id) => {
    const col = collapsedTargets(id);
    if (!col.length || expanded) return null;
    const agents = col.filter((t) => roleOf(t) === "agent").length;
    const label = agents ? `${agents} agents` : `reads ${col.length}`;
    const bw = Math.ceil(measure(label, "600 10px Inter, ui-sans-serif, system-ui, sans-serif")) + 12;
    return { label, bw, k: agents ? "" : " k" };
  };
  const nodeW = (id) => { const b = badgeInfo(id); return pillW(id) + (b ? 4 + b.bw : 0); };
  const rowH = () => G.optH + G.pillH + G.capH + 6;
  function chainRows(lane) {
    const maxW = G.laneW - 2 * G.lanePad; const rows = [[]]; let x = 0;
    for (const st of lane.steps) { const w = nodeW(st.id); if (x > 0 && x + w > maxW) { rows.push([]); x = 0; } rows[rows.length - 1].push(st); x += w + G.arrowW; }
    return rows;
  }

  const positions = {};   // id -> {x,y,w,h} for hover links
  const nodeEls = {};

  function drawNode(parent, id, x, y, opts = {}) {
    const n = NODES[id];
    const h = opts.h ?? G.pillH;
    const w = opts.w ?? pillW(id);
    const g = el("g", { class: `node r-${n.role}${n.type === "agent" ? " agent" : ""}${opts.optional ? " optional" : ""}`, "data-id": id, tabindex: 0, role: "button", "aria-label": `${id}: ${n.description.slice(0, 120)}`, transform: `translate(${x},${y})` }, parent);
    el("rect", { class: "pill", width: w, height: h, rx: n.type === "agent" ? h / 2 : 8 }, g);
    text(g, w / 2, h / 2 + 4.5, id, "lbl", { "text-anchor": "middle" });
    let total = w;
    const b = badgeInfo(id);
    if (b) {
      el("rect", { class: "badge" + b.k, x: w + 4, y: h / 2 - 8, width: b.bw, height: 16, rx: 8 }, g);
      text(g, w + 4 + b.bw / 2, h / 2 + 3.5, b.label, "badge-t" + b.k, { "text-anchor": "middle" });
      total = w + 4 + b.bw;
    }
    if (opts.optional) text(g, 0, -4, "optional", "t-tiny");
    if (opts.writes) text(g, w / 2, h + G.capH - 2, "↳ " + opts.writes, "t-cap", { "text-anchor": "middle" });
    if (opts.note) text(g, w / 2, h + G.capH - 2, opts.note, "t-cap", { "text-anchor": "middle" });
    positions[id] = { x, y, w, h };
    nodeEls[id] = g;
    return { w: total, h };
  }

  function laneHeight(lane) {
    let h = G.lanePad + G.titleH + chainRows(lane).length * rowH();
    if (lane.extras?.length) h += G.extraGap + G.extraH + G.capH;
    return h + G.lanePad;
  }

  // ======================================================= layout pass
  const laneTops = [];
  let y = G.headerH;
  for (const lane of SEC.lanes) { laneTops.push(y); y += laneHeight(lane) + G.laneGap; }
  const lanesBottom = y - G.laneGap;

  // knowledge region (expanded only), below lanes in the lane column
  let knowledgeTop = null, knowledgeH = 0;
  if (expanded && SEC.knowledge.ids.length) {
    knowledgeTop = lanesBottom + G.laneGap;
    // wrap pills across laneW
    let rows = 1, cx = G.lanePad;
    for (const id of SEC.knowledge.ids) { const w = pillW(id); if (cx + w > G.laneW - G.lanePad) { rows++; cx = G.lanePad; } cx += w + 12; }
    knowledgeH = G.lanePad + G.titleH + rows * (G.pillH + 12) + G.lanePad - 12;
  }
  const leftBottom = knowledgeTop === null ? lanesBottom : knowledgeTop + knowledgeH;

  // platforms column
  const platTileW = (G.platW - G.platGap * (G.platCols - 1)) / G.platCols;
  const platTiles = [];
  {
    const colY = Array(G.platCols).fill(G.headerH);
    SEC.platforms.forEach((p, i) => {
      const c = i % G.platCols;
      const groups = {};
      for (const s of p.skills) (groups[s.phase] ??= []).push(s.id);
      const h = 14 + 22 + Object.keys(groups).length * (14 + G.pillH + 8) + 8;
      platTiles.push({ p, x: G.platX + c * (platTileW + G.platGap), y: colY[c], w: platTileW, h, groups });
      colY[c] += h + G.platGap;
    });
    var platBottom = Math.max(...colY) - G.platGap;
  }

  const sideTop = Math.max(leftBottom, platBottom) + G.sideGap;
  const sideRows = [[]];
  let sideWidth = 0;
  const sideMaxWidth = G.platX + G.platW - G.laneX - G.lanePad * 2;
  for (const id of SEC.sideDoors) {
    const w = pillW(id);
    if (sideWidth && sideWidth + w > sideMaxWidth) { sideRows.push([]); sideWidth = 0; }
    sideRows.at(-1).push(id);
    sideWidth += w + 12;
  }
  const sideH = G.lanePad + G.titleH + sideRows.length * (G.pillH + 12) + G.lanePad - 12;
  const legendTop = sideTop + sideH + 22;
  const H = legendTop + G.legendH + G.footerH;
  svg.setAttribute("viewBox", `0 0 ${G.W} ${H}`);
  svg.setAttribute("width", G.W); svg.setAttribute("height", H);
  if (SHOT) { const m = document.createElement("meta"); m.name = "board-height"; m.content = String(H); document.head.appendChild(m); }

  // defs
  const defs = el("defs", {}, svg);
  const mk = el("marker", { id: "arr", viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" }, defs);
  el("path", { d: "M0 0 L10 5 L0 10 z", fill: "#8a8f98" }, mk);

  // ======================================================= header + install strip
  {
    const g = el("g", {}, svg);
    text(g, G.PAD, 44, DATA.plugins[Object.keys(DATA.plugins)[0]].label, "t-title");
    text(g, G.PAD + measure(DATA.plugins[Object.keys(DATA.plugins)[0]].label, "700 26px Inter, system-ui, sans-serif") + 16, 44, "how the skills fit together", "t-sub");
    // install strip
    let x = G.PAD;
    const y0 = 66;
    text(g, x, y0 + 14, "INSTALLS AS", "t-tiny"); x += 84;
    for (const [pid, p] of Object.entries(DATA.plugins)) {
      const label = `${p.label} · ${p.install === "always" ? "always installed" : p.install}`;
      const w = measure(label, G.smallFont) + 20;
      el("rect", { x, y: y0, width: w, height: 24, rx: 6, fill: "#1c1c21" }, g);
      text(g, x + w / 2, y0 + 16, label, "", { "text-anchor": "middle", style: "fill:#fff", "font-size": 12, "font-weight": 600 });
      x += w + 10;
    }
    x += 6; text(g, x, y0 + 14, "INTO", "t-tiny"); x += 36;
    for (const r of DATA.runtimes) {
      const label = `${r.label} · ${r.how}`;
      const w = measure(label, G.smallFont) + 20;
      const c = el("g", { class: "chipg" }, g);
      el("rect", { class: "chip", x, y: y0, width: w, height: 24 }, c);
      text(c, x + w / 2, y0 + 16, label, "", { "text-anchor": "middle" });
      x += w + 8;
    }
  }

  // ======================================================= entry + tracks
  const entryCy = (laneTops[0] + lanesBottom) / 2;
  {
    const g = el("g", { class: "entry" }, svg);
    const ex = G.entryX, ey = entryCy - G.entryH / 2;
    // "you" figure
    const fx = ex + 30, fy = ey - 54;
    el("circle", { cx: fx, cy: fy, r: 9, fill: "#1c1c21" }, g);
    el("path", { d: `M${fx - 16} ${fy + 34} a16 16 0 0 1 32 0 z`, fill: "#1c1c21" }, g);
    text(g, fx + 24, fy + 6, "you", "t-h");
    el("path", { class: "arrow", d: `M${fx + 60} ${fy + 8} q 40 0 40 ${ey - fy - 12}`, "marker-end": "url(#arr)" }, g);
    el("rect", { class: "pill", x: ex, y: ey, width: G.entryW, height: G.entryH }, g);
    text(g, ex + G.entryW / 2, ey + 40, DATA.entry.label, "", { "text-anchor": "middle", "font-size": 20, "font-weight": 700 });
    text(g, ex + G.entryW / 2, ey + 62, DATA.entry.sub, "", { "text-anchor": "middle", "font-size": 12, opacity: .8 });
    // tracks to lanes
    SEC.lanes.forEach((lane, i) => {
      const ly = laneTops[i] + G.lanePad + G.titleH / 2 + 2;
      const x0 = ex + G.entryW, x1 = G.laneX;
      const mx = (x0 + x1) / 2;
      el("path", { class: "track", d: `M${x0} ${entryCy} C ${mx} ${entryCy}, ${mx} ${ly}, ${x1} ${ly}` }, svg);
    });
  }

  // ======================================================= lanes
  SEC.lanes.forEach((lane, i) => {
    const top = laneTops[i], h = laneHeight(lane);
    const g = el("g", { class: "lane", "data-lane": lane.id }, svg);
    el("rect", { class: "region", x: G.laneX, y: top, width: G.laneW, height: h }, g);
    const ty = top + G.lanePad + 18;
    text(g, G.laneX + G.lanePad, ty, lane.title, "t-h");
    const tw = measure(lane.title, "600 15px Inter, system-ui, sans-serif");
    text(g, G.laneX + G.lanePad + tw + 12, ty, "◂ " + lane.outcome, "t-cap");
    // group tag, right
    const tag = lane.tag, tagW = measure(tag, G.smallFont) + 18;
    el("rect", { class: "chip", x: G.laneX + G.laneW - G.lanePad - tagW, y: top + G.lanePad, width: tagW, height: 22 }, g);
    text(g, G.laneX + G.laneW - G.lanePad - tagW / 2, top + G.lanePad + 15, tag, "", { "text-anchor": "middle", "font-size": 11.5, fill: "#5b5f6a" });
    // main chain, wrapped onto more rows when it outgrows the lane
    const rows = chainRows(lane);
    const x0 = G.laneX + G.lanePad;
    let py = top + G.lanePad + G.titleH + G.optH;
    rows.forEach((row, r) => {
      let x = x0;
      if (r > 0) el("path", { class: "arrow", d: `M${x0 - 24} ${py + G.pillH / 2} H${x0 - 3}`, "marker-end": "url(#arr)" }, g);
      row.forEach((st, j) => {
        const { w } = drawNode(g, st.id, x, py, { optional: st.optional, writes: st.writes });
        const last = j === row.length - 1;
        if (!last) el("path", { class: "arrow", d: `M${x + w + 3} ${py + G.pillH / 2} H${x + w + G.arrowW - 3}`, "marker-end": "url(#arr)" }, g);
        else if (r < rows.length - 1) el("path", { class: "arrow", d: `M${x + w + 3} ${py + G.pillH / 2} H${x + w + 22}`, "marker-end": "url(#arr)" }, g);
        x += w + G.arrowW;
      });
      py += rowH();
    });
    py -= rowH();
    // extras row
    if (lane.extras?.length) {
      let ex = G.laneX + G.lanePad; const ey = py + G.pillH + G.capH + G.extraGap;
      text(g, ex, ey + 18, "ALSO", "t-tiny"); ex += 44;
      for (const st of lane.extras) {
        const { w } = drawNode(g, st.id, ex, ey, { h: G.extraH, note: st.note });
        ex += w + 14;
      }
    }
  });

  // ======================================================= knowledge (expanded)
  if (knowledgeTop !== null) {
    const g = el("g", {}, svg);
    el("rect", { class: "region", x: G.laneX, y: knowledgeTop, width: G.laneW, height: knowledgeH }, g);
    text(g, G.laneX + G.lanePad, knowledgeTop + G.lanePad + 18, SEC.knowledge.title, "t-h");
    text(g, G.laneX + G.lanePad + measure(SEC.knowledge.title, "600 15px Inter, system-ui, sans-serif") + 12, knowledgeTop + G.lanePad + 18, "◂ reference the agent reads", "t-cap");
    let x = G.laneX + G.lanePad, yy = knowledgeTop + G.lanePad + G.titleH;
    for (const id of SEC.knowledge.ids) {
      const w = pillW(id);
      if (x + w > G.laneX + G.laneW - G.lanePad) { x = G.laneX + G.lanePad; yy += G.pillH + 12; }
      drawNode(g, id, x, yy); x += w + 12;
    }
  }

  // ======================================================= platforms
  {
    const g = el("g", {}, svg);
    text(g, G.platX, G.headerH - 10, "PLATFORMS", "t-tiny");
    const PH = { setup: "set up once", building: "while building", reference: "reference" };
    for (const t of platTiles) {
      el("rect", { class: "tile", x: t.x, y: t.y, width: t.w, height: t.h }, g);
      text(g, t.x + 14, t.y + 26, t.p.title, "t-h");
      let yy = t.y + 36;
      for (const [phase, ids] of Object.entries(t.groups)) {
        text(g, t.x + 14, yy + 12, (PH[phase] ?? phase).toUpperCase(), "t-tiny"); yy += 14 + 4;
        let x = t.x + 14;
        for (const id of ids) { const { w } = drawNode(g, id, x, yy); x += w + 8; }
        yy += G.pillH + 8;
      }
    }
  }

  // ======================================================= side doors
  {
    const g = el("g", {}, svg);
    el("rect", { class: "region", x: G.laneX, y: sideTop, width: G.platX + G.platW - G.laneX, height: sideH }, g);
    text(g, G.laneX + G.lanePad, sideTop + G.lanePad + 18, "Side doors", "t-h");
    text(g, G.laneX + G.lanePad + measure("Side doors", "600 15px Inter, system-ui, sans-serif") + 12, sideTop + G.lanePad + 18, "◂ utilities you run directly", "t-cap");
    let yy = sideTop + G.lanePad + G.titleH;
    for (const row of sideRows) {
      let x = G.laneX + G.lanePad;
      for (const id of row) { const { w } = drawNode(g, id, x, yy); x += w + 12; }
      yy += G.pillH + 12;
    }
  }

  // ======================================================= legend + footer
  {
    const g = el("g", {}, svg);
    let x = G.PAD, yy = legendTop + 8;
    const lab = (s, dx) => { text(g, x + dx, yy + 11, s, "", { "font-size": 12, fill: "#5b5f6a" }); x += dx + measure(s, G.smallFont) + 26; };
    text(g, x, yy + 11, "LEGEND", "t-tiny"); x += 64;
    const swatches = [
      [{ fill: "#2f6fed", stroke: "#2f6fed" }, "you run it"],
      [{ fill: "#fff", stroke: "#2f6fed", "stroke-width": 1.5 }, "you or another skill"],
      [{ fill: "#0e8a7a", stroke: "#0e8a7a" }, "runs for you"],
      [{ fill: "#fff", stroke: "#8a8f98", "stroke-width": 1.5, "stroke-dasharray": "4 2" }, "reference the agent reads"],
      [{ fill: "#8957e5", stroke: "#8957e5", rx: 7 }, "subagent"],
    ];
    for (const [attrs, label] of swatches) { el("rect", { x, y: yy, width: 22, height: 14, rx: 4, ...attrs }, g); lab(label, 30); }
    el("path", { class: "arrow", d: `M${x} ${yy + 7} H${x + 22}`, "marker-end": "url(#arr)" }, g); lab("main path", 30);
    text(g, x, yy + 11, "↳ caption", "t-cap"); lab("artifact it writes", 66);
    el("rect", { class: "badge k", x, y: yy - 1, width: 48, height: 16, rx: 8, fill: "#f1f1ee", stroke: "#8a8f98" }, g);
    text(g, x + 24, yy + 11, "reads 3", "", { "text-anchor": "middle", "font-size": 10, "font-weight": 600, fill: "#5b5f6a" }); lab("collapsed group — click to list, toggle to expand", 56);
    const c = DATA.counts;
    text(g, G.PAD, legendTop + G.legendH + 14, `Generated by ${DATA.generated} from skills/ frontmatter + docs/plugin-map/map.json · ${c.skills} skills · ${c.agents} agents · ${c.plugins} plugin${c.plugins === 1 ? "" : "s"}`, "t-mono");
  }

  // ======================================================= interaction
  const links = el("g", { id: "links" }, svg);
  const absCenter = (id) => {
    const g = nodeEls[id]; if (!g) return null;
    const m = g.transform.baseVal.consolidate()?.matrix; const p = positions[id];
    return { x: (m?.e ?? 0) + p.w / 2, y: (m?.f ?? 0) + p.h / 2 };
  };
  function light(id) {
    const n = NODES[id]; if (!n) return;
    svg.classList.add("lit");
    const on = new Set([id, ...n.calls, ...n.calledBy, ...(n.routes ?? []), ...(n.routedBy ?? [])]);
    for (const [k, g] of Object.entries(nodeEls)) g.classList.toggle("on", on.has(k));
    links.innerHTML = "";
    const a = absCenter(id);
    for (const t of [...n.calls, ...n.calledBy, ...(n.routes ?? []), ...(n.routedBy ?? [])]) {
      const b = absCenter(t); if (!b) continue;
      const mx = (a.x + b.x) / 2;
      el("path", { class: "link", d: `M${a.x} ${a.y} C ${mx} ${a.y}, ${mx} ${b.y}, ${b.x} ${b.y}` }, links);
    }
  }
  function unlight() { svg.classList.remove("lit"); for (const g of Object.values(nodeEls)) g.classList.remove("on"); links.innerHTML = ""; }

  const drawer = document.getElementById("drawer"), body = document.getElementById("drawer-body");
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const ROLE_LABEL = { human: "you run it", both: "you or another skill", auto: "runs for you", knowledge: "reference the agent reads" };
  function openDrawer(id) {
    const n = NODES[id]; if (!n) return;
    const list = (ids) => ids.length ? `<ul>${ids.map((t) => `<li><button type="button" data-go="${esc(t)}">${esc(t)}</button></li>`).join("")}</ul>` : `<div class="none">none</div>`;
    body.innerHTML = `
      <h2>${esc(n.display)}</h2>
      <div class="id">${esc(n.id)}</div>
      <div class="meta">
        <span class="role">${n.type === "agent" ? "subagent" + (n.kind ? " · " + esc(n.kind) : "") : esc(ROLE_LABEL[n.role])}</span>
        <span>${esc(n.plugin)}</span>
        ${n.origin ? `<span>${esc(n.origin)}${n.repo ? ` · <a href="${esc(n.repo)}" target="_blank" rel="noopener">upstream</a>` : ""}</span>` : ""}
        ${n.humanOnly ? `<span>explicit invocation only</span>` : ""}
      </div>
      ${n.argumentHint ? `<h3>Argument</h3><div class="hint">${esc(n.argumentHint)}</div>` : ""}
      <h3>Description</h3><p>${esc(n.description)}</p>
      <h3>Runs, dispatches or reads</h3>${list(n.calls)}
      <h3>Run by</h3>${list(n.calledBy)}
      <h3>Offers as an explicit next step</h3>${list(n.routes ?? [])}
      <h3>Offered by</h3>${list(n.routedBy ?? [])}`;
    drawer.classList.add("open"); drawer.setAttribute("aria-hidden", "false");
    light(id);
    body.querySelector("h2").setAttribute("tabindex", "-1"); body.querySelector("h2").focus();
  }
  function closeDrawer() { drawer.classList.remove("open"); drawer.setAttribute("aria-hidden", "true"); unlight(); }
  drawer.querySelector(".close").addEventListener("click", closeDrawer);
  body.addEventListener("click", (e) => { const b = e.target.closest("[data-go]"); if (b) { openDrawer(b.dataset.go); nodeEls[b.dataset.go]?.scrollIntoView({ block: "center", behavior: "smooth" }); } });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(); });

  for (const [id, g] of Object.entries(nodeEls)) {
    g.addEventListener("mouseenter", () => light(id));
    g.addEventListener("mouseleave", () => { if (!drawer.classList.contains("open")) unlight(); });
    g.addEventListener("focus", () => light(id));
    g.addEventListener("blur", () => { if (!drawer.classList.contains("open")) unlight(); });
    g.addEventListener("click", () => openDrawer(id));
    g.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openDrawer(id); } });
  }

  const toggle = document.getElementById("toggle");
  toggle.setAttribute("aria-pressed", String(expanded));
  toggle.addEventListener("click", () => { q.set("expanded", expanded ? "0" : "1"); location.search = q.toString(); });
})();
</script>
</body>
</html>
